name: Pre-release report

# Generates the pre-release report every hour and commits the HTML into
# pre-release-report/. The scripts read the public GitHub API (~12 calls/run:
# CD runs + deployments per repo; the PR lists come from git clones),
# authenticated with the built-in GITHUB_TOKEN (injected below) so they use that
# token's ~1000/hour budget rather than the 60/hour anonymous per-IP cap that
# shared runner IPs frequently exhaust. As a safety net the "Generate" step still
# FAILS instead of committing if it ever sees a throttle/fetch error, so a bad
# run is a visible red X, never a corrupt report.

on:
  schedule:
    - cron: '0 * * * *'        # every hour, on the hour (UTC)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

# Allow the job to push the regenerated report back to the repo.
permissions:
  contents: write

# Never let two report runs overlap (they'd race on the commit/push).
concurrency:
  group: pre-release-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate report
        env:
          # Built-in token (auto-provided, no setup/secret needed). Authenticates
          # the API calls so they use the ~1000/hour token budget instead of the
          # 60/hour anonymous cap that shared runner IPs frequently exhaust.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p pre-release-report
          # Keep the previous report so the freshness check below can compare.
          cp pre-release-report/pre-release-report.html /tmp/prev-report.html 2>/dev/null || true
          # GitHub's runs API is flaky from runners: it intermittently returns a
          # run list missing the newest couple of weeks (about half of the hourly
          # runs on some days), which the freshness check catches. Rather than
          # fail on the first such answer, regenerate up to 3 times, pausing
          # between attempts; only if every attempt is stale/throttled do we fail
          # (red X, no commit) — never commit a degraded report.
          ok=0
          for attempt in 1 2 3; do
            echo "===== generate attempt $attempt ====="
            # stdout -> the HTML file; stderr -> a log we inspect for throttling.
            bash pre-release-output-script.sh 2>/tmp/report.err \
              | tee pre-release-report/pre-release-report.html
            echo "----- script stderr -----"
            cat /tmp/report.err || true
            # Rate-limited or a runs fetch failed -> degraded report, retry.
            if grep -qE 'error: (403|429)|failed to fetch runs' /tmp/report.err; then
              echo "::warning::attempt $attempt: GitHub API throttled or a runs fetch failed."
            # A repo section's newest run number went BACKWARDS vs the previous
            # report -> incomplete run listing that shifts the release boundary
            # into the past, retry.
            elif [ -f /tmp/prev-report.html ] && \
                 ! bash report-freshness-check.sh /tmp/prev-report.html pre-release-report/pre-release-report.html; then
              echo "::warning::attempt $attempt: stale run listing from the GitHub API."
            else
              ok=1; break
            fi
            [ "$attempt" -lt 3 ] && sleep 90
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::GitHub API throttled/stale on every attempt — not committing this report."
            git checkout -- pre-release-report/pre-release-report.html 2>/dev/null || true
            exit 1
          fi

      - name: Commit report if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pre-release-report/pre-release-report.html
          if git diff --staged --quiet; then
            echo "No change in the report — nothing to commit."
            exit 0
          fi
          git commit -m "Update pre-release report [skip ci]"
          # Retry on a concurrent push from the post-release workflow. The two
          # reports touch different files, so the rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt) — rebasing on latest main…"
            git pull --rebase origin main || exit 1
          done
          echo "::error::could not push report after retries"; exit 1
