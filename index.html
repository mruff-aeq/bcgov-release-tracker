<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>BC Gov Release Reports</title>
<style>
  /* Light only, always: color-scheme light (above) also stops browsers from
     auto-darkening the unstyled report pages inside the iframes. */
  :root {
    color-scheme: light;
    --bg: #f6f8fa; --fg: #1f2328; --border: #d1d9e0;
    --tab-bg: #ffffff; --tab-active: #0969da; --tab-active-fg: #ffffff;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--tab-bg); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; margin-right: 12px; }
  .tab {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--fg); font-size: 13px; font-weight: 500;
    cursor: pointer; text-decoration: none;
  }
  .tab[aria-selected="true"] {
    background: var(--tab-active); border-color: var(--tab-active);
    color: var(--tab-active-fg);
  }
  .spacer { flex: 1; }
  .raw { font-size: 12px; color: var(--tab-active); text-decoration: none; }
  .raw:hover { text-decoration: underline; }
  main { flex: 1; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: none; background: #fff; }
  iframe.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>BC Gov Release Reports</h1>
  <button class="tab" id="tab-pre"  aria-selected="true">Pre-release</button>
  <button class="tab" id="tab-post" aria-selected="false">Post-release</button>
  <span class="spacer"></span>
  <a class="raw" id="raw-link" href="pre-release-report/pre-release-report.html" target="_blank" rel="noopener">open report in its own tab &#8599;</a>
</header>
<main>
  <iframe id="frame-pre"  class="active" src="pre-release-report/pre-release-report.html"  title="Pre-release report"></iframe>
  <iframe id="frame-post" loading="lazy" src="post-release-report/post-release-report.html" title="Post-release report"></iframe>
</main>
<script>
  const PAGES = {
    pre:  { tab: document.getElementById("tab-pre"),  frame: document.getElementById("frame-pre"),
            href: "pre-release-report/pre-release-report.html" },
    post: { tab: document.getElementById("tab-post"), frame: document.getElementById("frame-post"),
            href: "post-release-report/post-release-report.html" },
  };
  const raw = document.getElementById("raw-link");
  function show(which) {
    for (const [key, p] of Object.entries(PAGES)) {
      const on = key === which;
      p.tab.setAttribute("aria-selected", on);
      p.frame.classList.toggle("active", on);
    }
    raw.href = PAGES[which].href;
    history.replaceState(null, "", "#" + which);
    try { localStorage.setItem("release-report-tab", which); } catch {}
  }
  PAGES.pre.tab.addEventListener("click", () => show("pre"));
  PAGES.post.tab.addEventListener("click", () => show("post"));

  // Post-release freshness: each repo section's run log lists deployments;
  // find the newest `test` push date per section, then dim every section
  // whose latest test push is older than the report-wide latest, so the
  // reader's eye lands on the repos that are part of the current cycle.
  // Same-origin iframe (same Pages host), so the DOM is reachable.
  function decoratePost() {
    const doc = PAGES.post.frame.contentDocument;
    if (!doc || !doc.body || doc.getElementById("freshness-style")) return;
    const style = doc.createElement("style");
    style.id = "freshness-style";
    style.textContent = `
      .stale-section { opacity: 0.4; filter: grayscale(60%); }
      .test-chip { display: inline-block; margin-left: 10px; padding: 2px 10px;
                   border-radius: 999px; vertical-align: middle; white-space: nowrap;
                   font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                   background: #dafbe1; color: #116329; border: 1px solid #aceebb; }
    `;
    (doc.head || doc.documentElement).appendChild(style);
    // Section = an <h2> plus its siblings up to the next <hr>. The run log
    // pads columns with 2+ spaces, so `#N  test  ...  YYYY-MM-DD` can't
    // false-match PR-table text.
    const runLine = /^#\d+\s{2,}test\s{2,}.*?(\d{4}-\d{2}-\d{2})/gm;
    const sections = [];
    for (const h2 of doc.querySelectorAll("h2")) {
      const nodes = [h2];
      let pre = null;
      for (let n = h2.nextSibling; n && !(n.nodeType === 1 && n.tagName === "HR"); n = n.nextSibling) {
        if (n.nodeType === 1) { nodes.push(n); if (n.tagName === "PRE") pre = n; }
      }
      let latest = null, m;
      if (pre) {
        runLine.lastIndex = 0;
        while ((m = runLine.exec(pre.textContent)) !== null)
          if (!latest || m[1] > latest) latest = m[1];
      }
      sections.push({ h2, nodes, latest });
    }
    const globalLatest = sections.reduce(
      (a, s) => (s.latest && (!a || s.latest > a) ? s.latest : a), null);
    if (!globalLatest) return;
    // Green pill or nothing: current-cycle sections get the pill, older
    // ones only dim. Sections with no run log at all (Repo Versions,
    // Repo CD) are not repo deployments — leave them untouched.
    // greenKeys collects bullet-list names for the pilled sections:
    //   "bcgov/lear (queue_services/business-bn)" -> queue_services/business-bn
    //   "bcgov/business-ui (web/business-registry-dashboard)"
    //                                 -> business-registry-dashboard
    //   "bcgov/lear"                  -> legal-api (the main lear service)
    //   "bcgov/<name>"                -> <name>
    const greenKeys = new Set();
    const keysFor = (h2text) => {
      const m = h2text.trim().match(/^bcgov\/(\S+)(?:\s+\((.+)\))?$/);
      if (!m) return [];
      if (m[2]) return [m[2], m[2].split("/").pop()];
      return m[1] === "lear" ? ["legal-api"] : [m[1]];
    };
    for (const s of sections) {
      if (!s.latest) continue;
      if (s.latest === globalLatest) {
        for (const k of keysFor(s.h2.textContent)) greenKeys.add(k);
        const chip = doc.createElement("span");
        chip.className = "test-chip";
        chip.textContent = "latest test push · " + s.latest;
        s.h2.appendChild(chip);
      } else {
        for (const n of s.nodes) n.classList.add("stale-section");
      }
    }
    // Mirror the pills onto the matching Repo Versions / Repo CD bullets
    // (the only li>strong nodes in the document).
    for (const strong of doc.querySelectorAll("li > strong")) {
      if (!greenKeys.has(strong.textContent.trim())) continue;
      const chip = doc.createElement("span");
      chip.className = "test-chip";
      chip.textContent = "latest";
      strong.insertAdjacentElement("afterend", chip);
    }
  }
  PAGES.post.frame.addEventListener("load", decoratePost);
  if (PAGES.post.frame.contentDocument?.readyState === "complete") decoratePost();
  const fromHash = location.hash.replace("#", "");
  let saved = null;
  try { saved = localStorage.getItem("release-report-tab"); } catch {}
  show(PAGES[fromHash] ? fromHash : PAGES[saved] ? saved : "pre");
</script>
</body>
</html>
