<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BC Gov Release Reports</title>
<script>
  // Each report is a full page. Honour #pre / #post links, else the last tab.
  let page = location.hash.slice(1);
  if (page !== "pre" && page !== "post") {
    try { page = localStorage.getItem("release-report-tab"); } catch {}
  }
  if (page !== "post") page = "pre";
  location.replace(page + "-release-report/" + page + "-release-report.html");
</script>
</head>
<body>
<noscript><a href="pre-release-report/pre-release-report.html">Pre-release</a> <a href="post-release-report/post-release-report.html">Post-release</a></noscript>
</body>
</html>
